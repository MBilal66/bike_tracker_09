<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bike Tracker</title>
<style>
:root{--bg:#e8eaee;--card:#ffffff;--tx:#10151c;--mu:#5b6675;--bd:#d9dee6;--ac:#e5173f;--ok:#16854a;--wa:#b86e00;--er:#d02f2f;--tr:#e3e8ee;--numfont:'Orbitron','Share Tech Mono',ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f15;--card:#141a23;--tx:#e8edf4;--mu:#93a0b2;--bd:#252f3d;--ac:#ff4357;--ok:#3ddc84;--wa:#ffb340;--er:#ff6b6b;--tr:#1e2734}}
:root[data-theme="dark"]{--bg:#0b0f15;--card:#141a23;--tx:#e8edf4;--mu:#93a0b2;--bd:#252f3d;--ac:#ff4357;--ok:#3ddc84;--wa:#ffb340;--er:#ff6b6b;--tr:#1e2734}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 "Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
#hdr{border-color:#222d3b;color:#e8edf4}
#hdr .sub{color:#93a0b2}
#hdr .meter{background:#05080c;border-color:#222d3b}
b,.big,.st{font-weight:700}
.sub{font-size:13px;color:var(--mu);margin-top:4px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;font-weight:500;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:#fff;font-weight:700;letter-spacing:.02em}
button.g{background:var(--tr);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
.bar{height:8px;background:var(--tr);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%}
.st{text-align:right;font-weight:700;font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px}
.tabs button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.tabs button{font-weight:700;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;max-height:90%;overflow:auto;box-sizing:border-box}
.big{font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);display:inline-block;cursor:pointer;margin:2px}
.swatch.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tx)}
.swatch.scheme{vertical-align:middle}
.meter{background:#111;font-family:var(--numfont);font-weight:800;font-style:italic;letter-spacing:1px;border:1px solid #000;border-radius:6px;font-size:19px}
.meter-blue{color:#3ea6ff;text-shadow:0 0 6px rgba(62,166,255,.85),0 0 14px rgba(62,166,255,.5)}
.meter-blue::placeholder{color:#1c4a66;text-shadow:none}
.meter-green{color:#4caf50;text-shadow:0 0 6px rgba(76,175,80,.85),0 0 14px rgba(76,175,80,.5)}
.meter-green::placeholder{color:#264d27;text-shadow:none}
.meter-gold{color:#ffd54f;text-shadow:0 0 6px rgba(255,213,79,.85),0 0 14px rgba(255,193,7,.5)}
.meter-gold::placeholder{color:#6b5a20;text-shadow:none}
.meter-white{color:#f5f5f5;text-shadow:0 0 6px rgba(255,255,255,.85),0 0 14px rgba(255,255,255,.4)}
.meter-white::placeholder{color:#666;text-shadow:none}
.meter-red{color:#ff5252;text-shadow:0 0 6px rgba(255,82,82,.85),0 0 14px rgba(255,82,82,.5)}
.meter-red::placeholder{color:#5c1f1f;text-shadow:none}

body{background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(128,128,128,.04) 22px 23px)}
b,.big,.st,button,.tabs button{font-style:italic}
button{color:var(--onac,#fff);clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);border-radius:0;padding:11px 20px}
button.g{color:var(--tx)}
#toast button{color:var(--tx)}
.tabs button{clip-path:none;border-radius:0;padding:14px}
.card{border-radius:12px}
#hdr{position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),linear-gradient(180deg,#171e29,#0a0e14);border-top:3px solid var(--ac)}
#hdr button{color:var(--onac,#fff)}
#gauge{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#gauge svg{flex:1 1 170px;max-width:230px;height:auto;overflow:visible}
.chips{flex:1 1 130px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chip{border-left:3px solid var(--ac);background:rgba(255,255,255,.05);padding:6px 10px;font-size:14px;line-height:1.25}
.chip .sub{margin:0;font-size:12px}
.chip b{display:block;font-size:15px}
@keyframes sweep{from{stroke-dashoffset:251.3}}
.arc-go{animation:sweep 1.1s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){.arc-go{animation:none}}
summary{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.box{aspect-ratio:1;border:2px solid var(--bd);border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center}
.bicon{font-size:22px}
.bname{font-size:10px;line-height:1.15;color:var(--tx);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wn{background:var(--card);border:1px solid var(--bd);border-left:4px solid;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;align-items:center;justify-content:space-between;gap:10px;z-index:8;font-size:14px}
#toast button{padding:6px 12px;background:var(--bg);color:var(--tx)}
.stat{text-align:center}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.li button{padding:6px 10px;font-size:12px}

/* ===== SPORT PRO UPGRADE ===== */
:root{--ac2:color-mix(in srgb,var(--ac) 55%,#fff);--glow:color-mix(in srgb,var(--ac) 45%,transparent);--disp:'Barlow Condensed','Barlow Semi Condensed',system-ui,sans-serif}
body{background-color:var(--bg);background-image:radial-gradient(900px 380px at 50% -120px,var(--glow),transparent 70%),repeating-linear-gradient(135deg,transparent 0 22px,rgba(128,128,128,.045) 22px 23px)}
.wrap{padding-top:10px}
.brand{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.brand .logo{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac,#fff);clip-path:polygon(22% 0,100% 0,78% 100%,0 100%);box-shadow:0 0 18px var(--glow)}
.brand .logo svg{width:20px;height:20px;margin-left:-2px}
.brand .t{font-family:var(--disp);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand .t span{color:var(--ac)}
.brand .tag{margin-left:auto;font:700 10px/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--mu);border:1px solid var(--bd);padding:5px 8px;border-radius:2px;display:flex;align-items:center;gap:6px}
.brand .tag i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.card{position:relative;border-radius:4px 16px 4px 16px;border:1px solid var(--bd);background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),var(--card));box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -14px rgba(0,0,0,.45)}
.card>b:first-child,.card>.row>b:first-child,summary b,.brand .t{font-family:var(--disp);font-size:18px;letter-spacing:.07em;text-transform:uppercase}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--ac);border-radius:0 3px 3px 0;opacity:.85}
#hdr{border-radius:4px 22px 4px 22px;border:1px solid #263243;border-top:3px solid var(--ac);box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 14px 40px -18px var(--glow);background:radial-gradient(280px 160px at 78% 40%,var(--glow),transparent 70%),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 6px),linear-gradient(180deg,#18202c,#090c11)}
#hdr::before{display:none}
#hdr>.row>b{font-family:var(--disp);letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--ac2)}
#hdr .meter{font-size:22px;border-radius:2px;border:1px solid #2a3647;background:linear-gradient(180deg,#02040a,#0b1018);box-shadow:inset 0 2px 8px #000}
input,select,textarea{border-radius:3px 10px 3px 10px;border:1px solid var(--bd);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
label{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));font-family:var(--disp);font-size:15px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 18px -8px var(--glow);transition:transform .1s,filter .15s}
button:active{transform:translateY(1px) scale(.985);filter:brightness(.92)}
button.g{background:var(--tr);box-shadow:none}
.bar{height:10px;background:var(--tr);border-radius:2px;transform:skewX(-18deg);position:relative;overflow:hidden}
.bar i{border-radius:0;box-shadow:0 0 10px currentColor;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--card) 9px 11px)}
.st{font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:3px 9px;border:1px solid currentColor;border-radius:2px;display:inline-block;flex:0 0 auto;text-align:center}
.big{font-family:var(--numfont);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.02em;text-shadow:0 0 14px var(--glow)}
.stat{background:linear-gradient(180deg,rgba(128,128,128,.07),transparent);border-bottom:2px solid var(--ac);padding:8px 4px;border-radius:2px}
.stat .sub{font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700}
.tabs{background:var(--card);border-top:1px solid var(--bd);justify-content:center;gap:0}
.tabs button{background:none;box-shadow:none;font-family:var(--disp);font-size:13px;letter-spacing:.16em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;position:relative;max-width:173px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{box-shadow:none;color:var(--ac)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--ac);box-shadow:0 0 14px var(--ac);transform:skewX(-30deg)}
.tabs button.on svg{filter:drop-shadow(0 0 6px var(--ac))}
.box{border-radius:3px 12px 3px 12px;border-width:2px;background:linear-gradient(180deg,rgba(128,128,128,.08),transparent),var(--card);transition:transform .12s}
.box:active{transform:scale(.95)}
.bname{font-family:var(--disp);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.wn{border-radius:2px 10px 2px 10px;font-family:var(--disp);font-size:16px;letter-spacing:.03em;background:linear-gradient(90deg,rgba(128,128,128,.12),var(--card))}
.chip{border-left-width:4px;background:linear-gradient(90deg,rgba(255,255,255,.09),rgba(255,255,255,.02));clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-right:16px}
.chip .sub{font-family:var(--disp);text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:700}
.chip b{font-family:var(--disp);font-size:17px;letter-spacing:.03em}
.li{border-top:1px dashed var(--bd)}
details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ac);border-bottom:2px solid var(--ac);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.card[open]>summary::after{transform:rotate(-135deg)}
.sheet{border-radius:22px 4px 0 0;border-top:3px solid var(--ac);box-shadow:0 -20px 50px -20px var(--glow)}

.swatch{box-shadow:0 0 10px -2px currentColor}
#toast{border-radius:3px 12px 3px 12px;border-left:4px solid var(--ac)}

.rev{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){#app>*,.brand .tag i{animation:none}}

/* ===== TECH PACK: sparklines, ghost digits, boot, alerts ===== */
.spk{display:block;margin:5px auto 0;overflow:visible}
.big{position:relative;isolation:isolate}
.big::before{content:attr(data-g);position:absolute;left:0;right:0;top:0;text-align:center;z-index:-1;opacity:.1;color:var(--tx)}
#boot{position:fixed;inset:0;z-index:30;background:#05080c;color:#e8edf4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:var(--numfont);transition:opacity .5s}
#boot.out{opacity:0;pointer-events:none}
#boot .bl{font-family:var(--disp);font-weight:800;font-style:italic;font-size:34px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
#boot .bl span{color:var(--ac)}
#boot .bs{font-size:12px;letter-spacing:.3em;color:#93a0b2;margin-bottom:22px}
#boot .ln{width:100%;max-width:320px;display:flex;justify-content:space-between;font-size:14px;letter-spacing:.08em;padding:5px 0;border-bottom:1px dashed #1f2a38;opacity:0;animation:btin .25s forwards}
#boot .ln b{font-style:normal}
#boot .ok{color:#3ddc84}#boot .wa{color:#ffb340}#boot .er{color:#ff6b6b}
#boot .pb{width:100%;max-width:320px;height:6px;margin-top:20px;background:#141a23;transform:skewX(-18deg);overflow:hidden}
#boot .pb i{display:block;height:100%;width:0;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:btbar 2.2s linear forwards}
#boot .sk{margin-top:14px;font-size:10px;letter-spacing:.25em;color:#4b5a6e}
@keyframes btin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes btbar{to{width:100%}}

.hs{flex:1 1 100%;display:flex;gap:12px;align-items:center;border-left:4px solid var(--hc,var(--ac));background:linear-gradient(90deg,rgba(255,255,255,.09),rgba(255,255,255,.02));padding:8px 14px 8px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
#gauge .hs svg{flex:0 0 64px;width:64px;max-width:64px;height:64px}
.hs .sub{font-family:var(--disp);text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:700;margin:0}
.hs b{font-family:var(--disp);font-size:20px;letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1.1}
.hs .why{font-family:var(--disp);font-size:13px;letter-spacing:.03em;text-transform:none;color:#93a0b2;font-weight:600}

/* ===== ICON SET (bare, no tile) ===== */
.ico{display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px;width:26px;height:26px;color:var(--ic,var(--ac));flex:0 0 auto}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px color-mix(in srgb,currentColor 60%,transparent))}
.ico .f{fill:currentColor;fill-opacity:.22}
.ico.s{width:20px;height:20px;margin-right:6px}.ico.s svg{width:19px;height:19px}
.ico.l{width:40px;height:40px;margin:0}.ico.l svg{width:38px;height:38px;stroke-width:1.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;vertical-align:middle;box-shadow:0 0 10px 1px currentColor;color:inherit}
.wn .dot{box-shadow:0 0 9px 1px currentColor}
@keyframes ping{from{transform:scale(1);opacity:.75}to{transform:scale(2.6);opacity:0}}
.sd{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--sc);box-shadow:0 0 9px 1px var(--sc)}
.sd.p::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sc);animation:ping 1.8s ease-out infinite}
.box,.li.sl{position:relative}
@media(prefers-reduced-motion:reduce){.sd.p::after{animation:none;opacity:.35}}
/* ===== NEGATIVE SPACE ===== */
body{line-height:1.5}
.wrap{padding:20px 20px 120px}
.brand{margin:4px 4px 22px}
.card{padding:22px 22px;margin-bottom:20px}
.card::before{top:22px;bottom:22px}
#hdr{padding:22px}
#gauge{margin-top:20px;gap:18px}
.chips{gap:12px}
.chip{padding:10px 16px 10px 14px}
.grid{gap:14px;margin-bottom:22px}
.box{padding:12px;gap:10px}
.wn{padding:14px 18px;margin-bottom:12px}
#warn{margin-bottom:8px}
.row{gap:14px}
.li{padding:16px 0}
.li .sub{margin-top:6px;line-height:1.55}
.sub{margin-top:6px;line-height:1.55}
label{margin:22px 0 8px}
input,select,textarea{padding:14px}
button{padding:13px 24px}
.li button{padding:8px 14px}
.stat{padding:16px 6px}
.card>b:first-child,.card>.row>b:first-child{display:block;margin-bottom:6px}

details.card[open]>summary{margin-bottom:10px}

#hdr>.row{gap:10px}
#hdr>.row>b{letter-spacing:.1em}
#hdr .meter{padding:12px 10px;min-width:0;letter-spacing:1px}
#hdr>.row>button{padding:12px 16px}
/* ===== COMPACT CARDS + BACKGROUND ART ===== */
body{overflow-x:hidden}
.wrap{position:relative;z-index:1;padding:16px 16px 110px}
.tabs{z-index:5}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgart svg{width:100%;height:100%;display:block}
#bgart .w{fill:none;stroke:var(--tx);stroke-opacity:.16;stroke-width:2}
#bgart .a{fill:none;stroke:var(--ac);stroke-opacity:.38;stroke-width:3}
#bgart .s{fill:var(--ac);fill-opacity:.2}
#bgart .t{fill:none;stroke:var(--tx);stroke-opacity:.12;stroke-width:6;stroke-dasharray:3 9}
.card{padding:15px 18px;margin-bottom:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 90%,transparent),color-mix(in srgb,var(--card) 82%,transparent));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card::before{top:16px;bottom:16px}
#hdr{padding:16px 18px}
#gauge{margin-top:12px;gap:12px}
#gauge svg{max-width:170px}
.chip{padding:7px 14px 7px 12px}
.chips{gap:8px}
.grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-bottom:14px}
.box{padding:6px;gap:6px}
.ico.l{width:32px;height:32px}.ico.l svg{width:30px;height:30px}
.bname{font-size:10.5px}
.wn{padding:10px 14px;margin-bottom:9px}
.li{padding:11px 0}
label{margin:16px 0 6px}
input,select,textarea{padding:11px}
.stat{padding:10px 4px}
.sheet{padding:22px 18px 26px}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatch{position:relative}
.swatch.cust{background:conic-gradient(#ff3b30,#ff9500,#ffd60a,#34c759,#00c7be,#0a84ff,#bf5af2,#ff2d92,#ff3b30);overflow:visible}
.swatch.cust::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 18px/1 system-ui;text-shadow:0 0 3px #000;pointer-events:none}
.swatch.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer;border-radius:50%}
/* ===== CARD PATTERNS ===== */
.pat-res::after,.pat-fuel::after,.pat-stat::after,.pat-ok::after,.pat-set::after,.pat-trip::after{content:"";position:absolute;pointer-events:none;border-radius:inherit}
/* reserve: hazard tape along the top edge */
.pat-res::after{left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(-45deg,var(--wa) 0 8px,transparent 8px 16px);opacity:.7;border-radius:4px 16px 0 0}
/* refuel: dotted pump-grid fading from the top-right corner */
.pat-fuel::after{inset:0;background:radial-gradient(var(--ac) 1.3px,transparent 1.8px) 0 0/11px 11px;opacity:.22;-webkit-mask:linear-gradient(225deg,#000 0,transparent 42%);mask:linear-gradient(225deg,#000 0,transparent 42%)}
/* stats: checkered-flag strip along the bottom edge */
.pat-stat::after{left:14px;right:14px;bottom:0;height:8px;background:conic-gradient(var(--tx) 25%,transparent 0 50%,var(--tx) 0 75%,transparent 0) 0 0/8px 8px;opacity:.16;-webkit-mask:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)}
/* on track: green speed lines in the top-right corner */
.pat-ok::after{inset:0;background:repeating-linear-gradient(-28deg,var(--ok) 0 2px,transparent 2px 10px);opacity:.2;-webkit-mask:linear-gradient(225deg,#000 0,transparent 30%);mask:linear-gradient(225deg,#000 0,transparent 30%)}
/* settings: fine cross-hatch in the top-right corner */
.pat-set::after{inset:0;background:repeating-linear-gradient(45deg,var(--tx) 0 1px,transparent 1px 9px),repeating-linear-gradient(-45deg,var(--tx) 0 1px,transparent 1px 9px);opacity:.09;-webkit-mask:linear-gradient(225deg,#000 0,transparent 30%);mask:linear-gradient(225deg,#000 0,transparent 30%)}
/* trip / map: road centre-line along the bottom */
.pat-trip::after{left:18px;right:18px;bottom:7px;height:3px;background:repeating-linear-gradient(90deg,var(--ac) 0 16px,transparent 16px 30px);opacity:.28}
/* attention tiles: hazard tape on the bottom edge */
.box{position:relative;overflow:hidden}
.box::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(-45deg,var(--bc,transparent) 0 6px,transparent 6px 12px);opacity:.75}
/* header panel: chevrons in the lower-right */
#hdr::after{content:"";position:absolute;right:-10px;bottom:-10px;width:150px;height:90px;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.05) 10px 12px);-webkit-mask:linear-gradient(135deg,transparent 30%,#000);mask:linear-gradient(135deg,transparent 30%,#000);pointer-events:none}

  const X=i=>2+i*(w-4)/(v.length-1),Y=y=>2+(hi-y)*(h-4)/(hi-lo),p=v.map((y,i)=>X(i).toFixed(1)+','+Y(y).toFixed(1)).join(' ');
  return `<svg class="spk" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon points="${X(0).toFixed(1)},${h} ${p} ${X(v.length-1).toFixed(1)},${h}" fill="var(--ac)" opacity=".15"/><polyline points="${p}" fill="none" stroke="var(--ac)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="2" fill="var(--ac)"/></svg>`;

function anomaly(){

  const last=ar[ar.length-1],prev=ar.slice(-6,-1),base=prev.reduce((s,x)=>s+x.eff,0)/prev.length,drop=(base-last.eff)/base;
  if(drop<.15||S.ad===last.at)return null;
  return{drop,base,v:last.eff,at:last.at};
}

function gApply(){const a=document.getElementById('garc'),n=document.getElementById('gnd');if(a)a.setAttribute('stroke-dashoffset',(251.3*(1-gF)).toFixed(1));if(n)n.setAttribute('transform','rotate('+((gF-.5)*180).toFixed(1)+' 100 100)')}

  gAnim=true;gF=0;
  const seg=[[0,1,950],[1,0,850],[0,target,950]],ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;let i=0,t0=null;
  function step(ts){

    gF=a+(b-a)*ease(x);gApply();

const RM=()=>!!window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

    e.className='burst';e.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;--r:${Math.round(Math.random()*360)}deg;${i%3?'':'background:var(--ok);'}`;
    document.body.appendChild(e);setTimeout(()=>e.remove(),800)}
}
function boxRects(){const m={};document.querySelectorAll('.box[data-id]').forEach(n=>{m[n.dataset.id]={r:n.getBoundingClientRect(),n}});return m}
function slideOk(id,before){

  if(li){li.classList.add('land');
    if(o){const t=li.getBoundingClientRect(),r=o.r,g=o.n.cloneNode(true);
      g.classList.add('ghost');g.style.cssText+=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;`;document.body.appendChild(g);
      g.animate([{transform:'none',opacity:1},{transform:`translate(${t.left+t.width/2-r.left-r.width/2}px,${t.top+t.height/2-r.top-r.height/2}px) scale(.3,.12)`,opacity:.15}],{duration:650,easing:'cubic-bezier(.5,0,.2,1)'}).onfinish=()=>g.remove()}}
  document.querySelectorAll('.box[data-id]').forEach(n=>{const p=before[n.dataset.id];if(!p)return;const r=n.getBoundingClientRect(),dx=p.r.left-r.left,dy=p.r.top-r.top;
    if(dx||dy)n.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'})});

let ODO=null,odoWait=false,odoGo=false;
function rollOdo(v){
  const o=$('odor');if(!o||odoWait)return;
  if(!ODO&&bootMs&&!odoGo){odoWait=true;setTimeout(()=>{odoWait=false;odoGo=true;rollOdo(est())},Math.max(0,bootMs-200));return}
  const txt=v?String(Math.round(v*10)/10):'';
  if(ODO&&ODO.txt===txt)return;
  const ch=[...txt],tr=p=>`translateY(${-p*1.4}em)`;
  if(!ODO||ODO.cells.length!==ch.length){
    o.innerHTML=ch.map(c=>c==='.'?'<span class="oc"><b>.</b></span>':'<span class="oc"><span>'+'0123456789'.repeat(2).replace(/./g,d=>'<b>'+d+'</b>')+'</span></span>').join('');
    ODO={txt:'',cells:[...o.children].map(el=>({st:el.firstElementChild.tagName==='SPAN'?el.firstElementChild:null,pos:0}))};
    void o.offsetWidth;o.parentNode.classList.add('ready');
  }
  const n=ch.length,rm=RM();
  ODO.cells.forEach((c,i)=>{
    if(!c.st)return;const d=+ch[i];c.pos=d;
    c.st.style.transition='none';c.st.style.transform=tr(d);
    if(rm)return;
    c.st.animate([{transform:tr(0),easing:'cubic-bezier(.4,0,.2,1)'},{transform:tr(9),offset:.5,easing:'cubic-bezier(.3,.1,.2,1)'},{transform:tr(d)}],{duration:1700,delay:i*70,fill:'backwards'});
  });
  ODO.txt=txt;

const CORE=['oil','tune','chain'];
const isOn=it=>it.on!==undefined?it.on:(CORE.includes(it.id)||it.lastKm!=null);
function setO(km){const d=today();S.odo={km,date:d};S.olog=(S.olog||[]).filter(x=>x.date!==d);S.olog.push({km,date:d});S.olog=S.olog.slice(-40)}
function rate(){const L=S.olog||[];if(L.length<2)return 0;const a=L[Math.max(0,L.length-8)],b=L[L.length-1],d=dd(a.date,b.date);return d>=3&&b.km>a.km?(b.km-a.km)/d:0}
function est(){const d=S.odo.date?Math.min(45,Math.max(0,dd(S.odo.date,today()))):0;return S.odo.km+Math.round(rate()*d)}
function info(it){
  const hk=it.km>0&&it.lastKm!=null,hd=it.days>0&&!!it.lastDate;
  if(!hk&&!hd)return{p:-1,s:'none'};
  const E=est();let p=0,remKm=null,remD=null;
  if(hk){remKm=it.lastKm+it.km-E;p=(E-it.lastKm)/it.km}
  if(hd){remD=dd(today(),add(it.lastDate,it.days));p=Math.max(p,dd(it.lastDate,today())/it.days)}
  const wk=it.wk!=null?it.wk:Math.max(100,.15*it.km),wd=it.wd!=null?it.wd:7;
  const s=((remKm!=null&&remKm<0)||(remD!=null&&remD<0))?'over':((remKm!=null&&remKm<=wk)||(remD!=null&&remD<=wd))?'soon':'ok';
  return{p,remKm,remD,s};
}

function dueDay(it,i){

  if(i.remD!=null)c.push(add(today(),Math.max(0,i.remD)));

  const r=resPts(),rows=[];

    const a=r[i-1],b=r[i],fl=S.fuel.filter(e=>e.km>=a&&e.km<b),l=fl.reduce((s,e)=>s+e.l,0);
    if(l>0)rows.push({dist:b-a,l,eff:(b-a)/l,at:b,date:dateAt(b),price:fl.reduce((s,e)=>s+(e.price||0),0)});
  }
  let avg=null,cpk=null;
  if(rows.length){
    avg=rows.reduce((s,x)=>s+x.dist,0)/rows.reduce((s,x)=>s+x.l,0);
    const pr=rows.filter(x=>x.price>0);
    if(pr.length)cpk=pr.reduce((s,x)=>s+x.price,0)/pr.reduce((s,x)=>s+x.dist,0);
  }
  return{rows,avg,cpk,last:rows.length?rows[rows.length-1].eff:null,lastAt:rows.length?rows[rows.length-1].at:null,n:rows.length};
}
function fuel(){
  const useR=resPts().length>0,f=calc(),c=useR?rcalc():f;
  const pend=pendingReserveKm();
  let h=`<div class="card pat-res"><b>🟡 Reserve</b>
  ${pend!=null
    ?`<div class="sub">On reserve since <b>${fmt(pend)} km</b>. When you fill up, just enter the litres below.</div><button class="g" style="width:100%;margin-top:10px" onclick="clearReserve()">↩ Undo reserve mark</button>`
    :`<div class="sub">Hit reserve but not refueling right now? Save the reading here. When you do fill up, just enter the litres below.</div><input id="rk" class="meter meter-gold" type="number" inputmode="numeric" placeholder="Odometer now (km)" value="${est()||''}"><button class="g" style="width:100%;margin-top:10px" onclick="markReserve()">⚠️ Mark as on reserve</button><div class="sub" id="rm" style="color:var(--er)"></div>`}
  </div>
  <div class="card pat-fuel"><b>⛽ Refuel</b>
  <label>Litres added</label><input id="fl" class="meter meter-gold" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 5.5">
  ${pend!=null?`<div class="sub" style="margin-top:14px">🟡 This fill-up will be recorded as coming off reserve (marked at ${fmt(pend)} km).</div>`:''}
  <details style="margin-top:8px"><summary class="sub">Add price (optional)</summary><input id="fp" type="number" inputmode="decimal" placeholder="Total paid" style="margin-top:6px"></details>
  <button style="width:100%;margin-top:12px" onclick="addFuel()">Save</button><div class="sub" id="fm" style="color:var(--er)"></div></div>`;
  h+=mapCard();
  const ar=(useR?c.rows:c.rows.filter(x=>x.eff).map(x=>({...x,at:x.km})));
  if(ar.length){
    const nw=ar[ar.length-1],od=ar.length>1?ar[ar.length-2]:null,df=od?nw.eff-od.eff:null;
    const col=x=>`<div class="stat"><div class="sub">${x.t}</div><div class="big" data-g="${gh(x.v)}">${x.v}</div><div class="sub">${x.u}</div>${x.d||''}${x.s||''}</div>`;
    h+=`<div class="card row pat-stat">${col({s:spark(ar.map(x=>x.eff).slice(-12)),t:'New avg',v:nw.eff.toFixed(2),u:'km/L at '+fmt(nw.at)+' km',d:df==null?'':`<div class="sub" style="color:${df>=0?'var(--ok)':'var(--er)'};font-weight:700">${df>=0?'▲ +':'▼ '}${df.toFixed(2)}</div>`})}${col(od?{s:spark(ar.slice(0,-1).map(x=>x.eff).slice(-12)),t:'Previous avg',v:od.eff.toFixed(2),u:'km/L at '+fmt(od.at)+' km'}:{t:'Previous avg',v:'—',u:'not enough data yet'})}</div>
    <div class="sub" style="margin:-4px 4px 12px">${useR?'Avg = km ridden between two reserve readings ÷ litres filled in that stretch.':'Avg = km since your previous refuel ÷ litres added in this refuel.'}</div>`;
    
  }else if(S.fuel.length){h+=`<div class="card sub">Saved. ${useR?'After your next “on reserve” refuel':'After your next refuel'} your km/L will appear here.</div>`}
  {
   if(ar.length){
    
   }}
  if(S.fuel.length){const mf=monthFuel();h+=`<div class="card" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center"><div class="sub" style="margin:0">⛽ Filled this month<br>(${mf.label})</div><div style="text-align:right"><div style="font-size:20px;font-weight:700">${+mf.l.toFixed(2)} L</div>${spark(S.fuel.slice(-10).map(e=>e.l))}</div></div>`}
  if(f.rows.length||S.reserve.length){
    const ev=[...f.rows.map(e=>({t:'f',km:e.km,e})),...S.reserve.map(km=>({t:'r',km}))].sort((a,b)=>b.km-a.km||(a.t==='r'?-1:1));
    h+=`<details class="card"><summary><b>History</b></summary>`;
    for(const x of ev.slice(0,20)){
      if(x.t==='r')h+=`<div class="li"><div>🟡 On reserve at ${fmt(x.km)} km<div class="sub">${esc((S.resDate&&S.resDate[x.km])||'')}</div></div><button class="g" onclick="delReserve(${x.km})">Delete</button></div>`;
      else{const e=x.e;h+=`<div class="li"><div>${fmt(e.km)} km · ${e.l} L${e.rk!=null?' ⚠️':''}<div class="sub">${e.eff&&!useR?e.dist+' km · '+e.eff.toFixed(1)+' km/L · ':''}${esc(e.date)}</div></div><button class="g" onclick="delFuel(${e.km})">Delete</button></div>`}
    }
    h+=`</details>`;
  }
  return h;
}
function addFuel(){
  const km=est(),l=+$('fl').value,p=+$('fp').value||0,msg=t=>{$('fm').textContent=t};
  if(!(l>0))return msg('Enter the litres.');
  if(!(km>0))return msg('Enter your current km in the Odometer box at the top first.');
  const last=S.fuel.length?Math.max(...S.fuel.map(e=>e.km)):null;
  if(last!=null&&km<=last)return msg('Your odometer ('+fmt(km)+' km) is not higher than your last refuel ('+fmt(last)+' km). Update the Odometer at the top first.');
  const e={km,l,price:p,date:today()};
  S.fuel.push(e);if(km>est())setO(km);save();render();
}
function delFuel(km){const i=S.fuel.findIndex(e=>e.km===km);if(i>=0){S.fuel.splice(i,1);save();render()}}
function bk(){const t=$('bt');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value).catch(()=>{})}catch(e){}$('bm').textContent='Backup ready. Copy it if it was not copied automatically.'}
function rs(){
  try{const o=JSON.parse($('bt').value);if(!o.items||!o.fuel||!o.odo)throw 0;S=o;S.log=S.log||[];S.olog=S.olog||[];S.reserve=S.reserve||[];S.trips=S.trips||[];save();render()}
  catch(e){$('bm').textContent='That does not look like a valid backup.'}
}
let T=null,W=null,wl=null,gmsg='';
function hav(a,b,c,d){const r=x=>x*Math.PI/180,p=r(c-a),q=r(d-b),z=Math.sin(p/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(q/2)**2;return 12742000*Math.asin(Math.sqrt(z))}
function tStart(){
  gmsg='';
  if(!navigator.geolocation){gmsg='This browser does not support GPS tracking.';render();return}
  T={dist:0,max:0,moveSec:0,stops:0,stopSec:0,stopStart:null,last:null,t0:Date.now(),spd:0,hist:[]};
  W=navigator.geolocation.watchPosition(onPos,gErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{wl=l}).catch(()=>{})}catch(e){}
  render();
}
function gErr(e){
  gmsg=e.code===1?'Location access is blocked. Allow location for this page in your browser or phone settings, then try again.':'No GPS signal yet. Keep the phone where it can see the sky.';
  if(e.code===1)tStop();else if(tab==='t')render();
}
function onPos(p){
  if(!T)return;
  const c=p.coords;if(c.accuracy>50)return;
  const t=p.timestamp,L=T.last;gmsg='';
  if(L){
    const dt=(t-L.t)/1000,d=hav(L.lat,L.lon,c.latitude,c.longitude);
    if(dt>0){
      const hasS=c.speed!=null&&!isNaN(c.speed),v=hasS?c.speed*3.6:d/dt*3.6;
      if(v<(hasS?3:6)){T.spd=0;if(T.stopStart==null)T.stopStart=t}
      else{
        if(T.stopStart!=null){const s=(t-T.stopStart)/1000;if(s>=20){T.stops++;T.stopSec+=s}T.stopStart=null}
        if(v<200){T.spd=v;T.dist+=d;T.moveSec+=dt;if(v>T.max)T.max=v}
      }
    }
  }
  T.hist.push([T.dist/1000,T.spd,T.max]);if(T.hist.length>50)T.hist.shift();
  T.last={lat:c.latitude,lon:c.longitude,t};
  if(tab==='t')render();
}
function tStop(){
  if(W!=null&&navigator.geolocation)navigator.geolocation.clearWatch(W);W=null;
  if(wl){wl.release().catch(()=>{});wl=null}
  if(T){
    const now=Date.now();
    if(T.stopStart!=null){const s=(now-T.stopStart)/1000;if(s>=20){T.stops++;T.stopSec+=s}}
    const km=T.dist/1000;
    if(km>=0.1){
      S.trips.unshift({date:today(),km:+km.toFixed(1),max:Math.round(T.max),avg:T.moveSec>0?+(km/(T.moveSec/3600)).toFixed(0):0,stops:T.stops,stopMin:Math.round(T.stopSec/60),dur:Math.round((now-T.t0)/60000)});
      S.trips=S.trips.slice(0,20);
      setO(Math.round((S.odo.km+km)*10)/10);
    }
  }
  T=null;save();render();
}
function trip(){
  const on=!!T,km=on?T.dist/1000:0,mv=on&&T.moveSec>0?km/(T.moveSec/3600):0;
  const b=(l,v,u,s)=>`<div class="stat"><div class="sub">${l}</div><div class="big" data-g="${gh(v)}">${v}</div><div class="sub">${u}</div>${s||''}</div>`;
  let h=`<div class="card pat-trip"><b>Ride tracker (GPS)</b><div class="sub">Tap Start before you ride. Keep this page open and the screen on (a phone mount helps). When you stop, the distance is added to your odometer. You can correct the odometer anytime in the Service tab.</div><button style="width:100%;margin-top:12px;${on?'background:var(--er)':''}" onclick="${on?'tStop()':'tStart()'}">${on?'■ Stop trip':'▶ Start trip'}</button><div class="sub" style="color:var(--er)">${esc(gmsg)}</div></div>`;
  if(on)h+=`<div class="card"><div class="row">${b('Distance',km.toFixed(2),'km',spark(T.hist.map(h=>h[0])))}${b('Speed',Math.round(T.spd),'km/h',spark(T.hist.map(h=>h[1])))}${b('Top speed',Math.round(T.max),'km/h',spark(T.hist.map(h=>h[2])))}</div><div class="row" style="margin-top:14px">${b('Avg riding',Math.round(mv),'km/h')}${b('Stops',T.stops,Math.round(T.stopSec/60)+' min stopped')}</div>${T.last?'':'<div class="sub">Waiting for GPS signal…</div>'}</div>`;
  if(S.trips.length){
    h+=`<div class="card"><b>Recent trips</b>`;
    for(const t of S.trips.slice(0,10))h+=`<div class="li"><div>${esc(t.date)} · ${t.km} km<div class="sub">${t.dur} min · avg ${t.avg} · top ${t.max} km/h · ${t.stops} stops (${t.stopMin} min)</div></div></div>`;
    h+=`</div>`;
  }
  return h;
}

const mapCard=()=>`<details class="card pat-trip"><summary><b>📍 No odometer? Add distance from a map</b></summary>
  <div class="sub" style="margin-top:8px">Enter where you rode from and to. Google Maps shows the road distance. Type that number here and it is added to your km.</div>
  <label>Start (leave empty to use where you are now)</label><input id="ms" placeholder="e.g. Home" oninput="mapUp()">
  <label>End</label><input id="me" placeholder="e.g. Office" oninput="mapUp()">
  <a id="ml" href="https://www.google.com/maps/dir/?api=1&travelmode=driving" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:12px;padding:11px;border-radius:10px;background:var(--tr);color:var(--tx);font-weight:600;text-decoration:none">🗺️ Open route in Google Maps</a>
  <label>Distance Google Maps shows (km)</label><input id="md" class="meter meter-white" type="number" inputmode="decimal" placeholder="e.g. 18.5">
  <label style="display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px"><input id="mr" type="checkbox" style="width:22px;height:22px;padding:0"> Round trip (count it twice)</label>
  <button style="width:100%;margin-top:12px" onclick="addDist()">Add to my km</button><div class="sub" id="mm" style="color:var(--er)"></div><div class="sub">If Maps shows miles, multiply by 1.6.</div></details>`;
function mapUp(){
  const a=$('ms').value.trim(),b=$('me').value.trim();
  $('ml').href='https://www.google.com/maps/dir/?api=1&travelmode=driving'+(a?'&origin='+encodeURIComponent(a):'')+(b?'&destination='+encodeURIComponent(b):'');
}
function addDist(){
  let d=+$('md').value;
  if(!(d>0)){$('mm').textContent='Type the distance Google Maps shows, in km.';return}
  if($('mr').checked)d*=2;
  setO(Math.round((S.odo.km+d)*10)/10);save();render();toast('Added '+Math.round(d*10)/10+' km to your odometer.');
}
setInterval(()=>{let ch=0;S.items.forEach(x=>{if(x.undo&&Date.now()-x.undo.t>=UNDO_MS){delete x.undo;ch=1}});if(ch){save();if(tab==='s')render()}},20000);
async function exportReport(){
  const em=$('em');em.textContent='Preparing…';
  try{
    if(typeof XLSX==='undefined'){em.textContent='Excel library failed to load. Check your connection and try again.';return}
    const dl=await claude.use('downloads');
    if(!dl){em.textContent='Downloads are not available in this view.';return}
    const months={};
    S.fuel.forEach(e=>{const m=e.date.slice(0,7);(months[m]=months[m]||[]).push({date:e.date,type:'Fuel',item:e.l+' L'+(e.rk!=null?' (reserve)':''),km:e.km,cost:e.price||0})});
    S.log.forEach(e=>{const m=e.date.slice(0,7);(months[m]=months[m]||[]).push({date:e.date,type:'Service',item:e.name,km:e.km,cost:e.price||0})});
    const keys=Object.keys(months).sort();
    const keep=keys.slice(-5);
    if(!keep.length){em.textContent='No fuel or service entries yet to export.';return}
    const wb=XLSX.utils.book_new(),summary=[['Month','Fuel cost','Service cost','Total']];
    for(const k of keep){
      const rows=months[k].sort((a,b)=>a.date.localeCompare(b.date));
      const data=[['Date','Type','Item','Km','Cost']];
      rows.forEach(r=>data.push([r.date,r.type,r.item,r.km,r.cost]));
      const fc=rows.filter(r=>r.type==='Fuel').reduce((s,r)=>s+r.cost,0),sc=rows.filter(r=>r.type==='Service').reduce((s,r)=>s+r.cost,0);
      data.push(['','','','Total',fc+sc]);
      const ws=XLSX.utils.aoa_to_sheet(data);
      XLSX.utils.book_append_sheet(wb,ws,k);
      summary.push([k,fc,sc,fc+sc]);
    }
    const sws=XLSX.utils.aoa_to_sheet(summary);
    XLSX.utils.book_append_sheet(wb,sws,'Summary');
    wb.SheetNames=['Summary',...wb.SheetNames.filter(n=>n!=='Summary')];
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const name=(S.name||'Bike').trim().replace(/[^a-z0-9]+/gi,'_')||'Bike';
    const res=await dl.save({filename:name+'_expenses.xlsx',data:new Blob([out],{type:'application/octet-stream'})});
    em.textContent=res.status==='saved'?'Saved. Only the latest '+keep.length+' month(s) are included.':'Sent.';
  }catch(err){
    em.textContent=(err&&err.code==='declined')?'':'Could not export ('+((err&&err.code)||'error')+').';
  }
}
load();applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
if(location.hash==='#trip')tab='t';else if(location.hash==='#service')tab='s';else tab='f';
bootMs=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?0:2600;

try{boot()}catch(e){}
